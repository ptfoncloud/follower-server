<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#f8fafc"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Follower — System Architecture</text>

  <!-- DRONE box -->
  <rect x="30" y="70" width="420" height="230" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="240" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">ON THE DRONE — follower-main</text>

  <rect x="55" y="115" width="160" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="140" text-anchor="middle" font-size="12" font-weight="bold">Pixy2</text>
  <text x="135" y="156" text-anchor="middle" font-size="10" fill="#475569">color blob (beacon)</text>

  <rect x="240" y="115" width="180" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="330" y="136" text-anchor="middle" font-size="12" font-weight="bold">ESP32</text>
  <text x="330" y="150" text-anchor="middle" font-size="10" fill="#475569">tracking state machine</text>
  <text x="330" y="163" text-anchor="middle" font-size="10" fill="#475569">safety_gate.h</text>

  <rect x="55" y="200" width="160" height="60" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="135" y="222" text-anchor="middle" font-size="12" font-weight="bold">MTF-01</text>
  <text x="135" y="238" text-anchor="middle" font-size="10" fill="#475569">optical flow + rangefinder</text>

  <rect x="240" y="200" width="180" height="60" rx="6" fill="#fecaca" stroke="#dc2626"/>
  <text x="330" y="222" text-anchor="middle" font-size="12" font-weight="bold">MicoAir743v2 AIO</text>
  <text x="330" y="238" text-anchor="middle" font-size="10" fill="#475569">ArduCopter FC + 35A ESC</text>

  <rect x="55" y="270" width="160" height="20" rx="4" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="135" y="284" text-anchor="middle" font-size="10" font-weight="bold">MLX90640 thermal</text>

  <!-- arrows inside drone box -->
  <line x1="215" y1="145" x2="240" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="175" x2="330" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="345" y="192" font-size="9" fill="#dc2626">MAVLink2, safety-gated</text>
  <line x1="215" y1="230" x2="240" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="196" font-size="9" fill="#475569">MAVLink1</text>

  <!-- RC -->
  <rect x="55" y="140" width="0" height="0"/>
  <rect x="470" y="115" width="130" height="55" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="535" y="137" text-anchor="middle" font-size="11" font-weight="bold">RadioMaster RP1</text>
  <text x="535" y="150" text-anchor="middle" font-size="9" fill="#475569">ELRS RX (CRSF)</text>
  <line x1="470" y1="142" x2="420" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="185" font-size="9" fill="#475569">RC override, always live</text>

  <!-- HENRI SERVER box -->
  <rect x="30" y="340" width="420" height="230" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="240" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">ON HENRI — gcs-ground-control + follower-server</text>

  <rect x="55" y="385" width="170" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="140" y="407" text-anchor="middle" font-size="12" font-weight="bold">FastAPI backend</text>
  <text x="140" y="422" text-anchor="middle" font-size="10" fill="#475569">REST + telemetry WS</text>
  <text x="140" y="435" text-anchor="middle" font-size="10" fill="#475569">SQLite history</text>

  <rect x="245" y="385" width="175" height="60" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="332" y="407" text-anchor="middle" font-size="12" font-weight="bold">follower-server</text>
  <text x="332" y="422" text-anchor="middle" font-size="10" fill="#475569">OpenCV thermal tracking</text>
  <text x="332" y="435" text-anchor="middle" font-size="10" fill="#475569">boresight error calc</text>

  <rect x="55" y="465" width="365" height="60" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="237" y="487" text-anchor="middle" font-size="12" font-weight="bold">Vue 3 dashboard (Mission Console)</text>
  <text x="237" y="503" text-anchor="middle" font-size="10" fill="#475569">ArtificialHorizon · ControlPanel · TacticalMap · TelemetryCard</text>

  <line x1="140" y1="445" x2="140" y2="465" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="332" y1="445" x2="332" y2="465" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- cross-box arrows -->
  <line x1="330" y1="260" x2="332" y2="385" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="345" y="310" font-size="9" fill="#dc2626">MAVLink2</text>
  <text x="345" y="322" font-size="9" fill="#dc2626">(bridged via MAVProxy)</text>

  <line x1="286" y1="290" x2="332" y2="385" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="440" y="355" font-size="9" fill="#6366f1">WiFi UDP :14600</text>
  <text x="440" y="367" font-size="9" fill="#6366f1">raw thermal frames</text>

  <!-- pilot / handset -->
  <rect x="680" y="115" width="150" height="55" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="755" y="137" text-anchor="middle" font-size="11" font-weight="bold">BetaFPV LiteRadio 3</text>
  <text x="755" y="150" text-anchor="middle" font-size="9" fill="#475569">handset — pilot override</text>
  <line x1="680" y1="142" x2="600" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="605" y="132" font-size="9" fill="#475569">ELRS RF link</text>

  <!-- operator -->
  <rect x="480" y="475" width="150" height="55" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="555" y="497" text-anchor="middle" font-size="11" font-weight="bold">Ground operator</text>
  <text x="555" y="510" text-anchor="middle" font-size="9" fill="#475569">browser, Mission Console</text>
  <line x1="480" y1="500" x2="420" y2="497" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <line x1="55" y1="565" x2="90" y2="565" stroke="#dc2626" stroke-width="2"/>
  <text x="98" y="569" font-size="10" fill="#334155">Flight-critical MAVLink (safety-gated, armed+GUIDED required)</text>
  <line x1="55" y1="583" x2="90" y2="583" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="98" y="587" font-size="10" fill="#334155">Non-flight-critical sensor/telemetry data</text>
  <line x1="55" y1="601" x2="90" y2="601" stroke="#475569" stroke-width="1.5"/>
  <text x="98" y="605" font-size="10" fill="#334155">Local bus / RF control link</text>
</svg>
